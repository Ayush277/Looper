name: LoopJob scan

on:
  schedule:
    # Hourly — the repo is public, so Actions minutes are unlimited/free.
    # A digest is sent only when a scan finds NEW matches, so this never spams:
    # silence means nothing new appeared that hour.
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: loopjob-scan
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cache embedding model & browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/ms-playwright
          key: loopjob-models-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Migrate database (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head && python -m app.db.seed

      - name: Run scan → match → email digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          LOOPJOB_ENV: prod
        run: |
          python -c "
          import asyncio
          from app.features.scans.orchestrator import run_scan
          asyncio.run(run_scan(trigger='scheduled'))
          "

      - name: Build dashboard page
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.export_page

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: backend/site

  deploy-dashboard:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
