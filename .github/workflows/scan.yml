name: LoopJob scan

on:
  schedule:
    # Hourly — the repo is public, so Actions minutes are unlimited/free.
    # A digest is sent only when a scan finds NEW matches, so this never spams:
    # silence means nothing new appeared that hour.
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: loopjob-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cache embedding model & browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/ms-playwright
          key: loopjob-models-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Migrate database (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head && python -m app.db.seed

      - name: Run scan → match → email digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOPJOB_ENV: prod
        run: |
          python -c "
          import asyncio
          from app.features.scans.orchestrator import run_scan
          asyncio.run(run_scan(trigger='scheduled'))
          "

      - name: Build dashboard page
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.export_page

      # Primary (and only) host: Cloudflare Pages.
      - name: Deploy dashboard to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy backend/site --project-name=loopjob --branch=main
          workingDirectory: .
